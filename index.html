<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wordtile 단어 퀴즈</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1424" media="(prefers-color-scheme: dark)">
<meta name="description" content="엑셀 단어장·문장 파일을 넣으면 짝 맞추기, 뜻 고르기, 문장 만들기 퀴즈를 만들어 주는 모바일 학습 사이트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@600;700;800;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column; every screen = top bar / scrolling body / action footer pinned to the bottom */
:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --ink: #17213a;
  --muted: #5b6884;
  --line: #d8dfec;
  --accent: #2c56c9;
  --accent-deep: #1b3c97;
  --accent-soft: #e2e9fb;
  --fill: #2c56c9;
  --fill-deep: #1b3c97;
  --good-fill: #1b9a52;
  --bad-fill: #d23047;
  --good: #1b9a52;
  --good-deep: #13753e;
  --good-soft: #d9f3e3;
  --bad: #d23047;
  --bad-deep: #a11d31;
  --bad-soft: #fce1e5;
  --gold: #e09b12;
  --tile: #ffffff;
  --tile-edge: #c8d1e3;
  --shade: rgba(20, 30, 60, .45);
  --font-display: "Nunito", "Jua", "IBM Plex Sans KR", system-ui, sans-serif;
  --font-body: "Nunito", "IBM Plex Sans KR", system-ui, sans-serif;
  --r: 14px;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1424; --surface: #161f35; --ink: #e7ecf7; --muted: #9aa7c2; --line: #28344f;
    --accent: #7d9bff; --accent-deep: #4a69d6; --accent-soft: #1d2a4c; --fill: #4566d6; --fill-deep: #2b45a3; --good-fill: #1f9a57; --bad-fill: #cf3f55;
    --good: #3cc87c; --good-deep: #229657; --good-soft: #10301e;
    --bad: #ff6c80; --bad-deep: #c23b50; --bad-soft: #3a1520;
    --gold: #f2b53a; --tile: #1a2440; --tile-edge: #2f3c5d; --shade: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1424; --surface: #161f35; --ink: #e7ecf7; --muted: #9aa7c2; --line: #28344f;
  --accent: #7d9bff; --accent-deep: #4a69d6; --accent-soft: #1d2a4c; --fill: #4566d6; --fill-deep: #2b45a3; --good-fill: #1f9a57; --bad-fill: #cf3f55;
  --good: #3cc87c; --good-deep: #229657; --good-soft: #10301e;
  --bad: #ff6c80; --bad-deep: #c23b50; --bad-soft: #3a1520;
  --gold: #f2b53a; --tile: #1a2440; --tile-edge: #2f3c5d; --shade: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  overscroll-behavior: none; word-break: keep-all;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
svg.i { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i .f { fill: currentColor; stroke: none; }

#app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; position: relative; }
.screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.body { flex: 1; overflow-y: auto; min-height: 0; padding-block: 8px 24px; display: flex; flex-direction: column; gap: 20px; }

/* top bars */
.bar { display: flex; align-items: center; gap: 12px; padding-block: 12px; min-height: 60px; }
.bar h1 { margin: 0; font-family: var(--font-display); font-size: 20px; font-weight: 800; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); flex: none; }
.icon-btn:active { background: var(--accent-soft); }
.logo { font-family: var(--font-display); font-weight: 900; font-size: 24px; letter-spacing: -.02em; display: flex; align-items: center; gap: 2px; flex: 1; }
.logo b { display: inline-block; background: var(--fill); color: #fff; padding: 0 7px 1px; border-radius: 8px; border-bottom: 3px solid var(--fill-deep); margin-left: 3px; transform: rotate(-4deg); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
.chip.flame { color: var(--gold); }
.chip.xp { color: var(--accent); }
.chip.dim { color: var(--muted); }

/* buttons with the pressed-tile edge */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 0 20px; border-radius: var(--r);
  font-family: var(--font-display); font-weight: 800; font-size: 17px; letter-spacing: .01em;
  background: var(--fill); color: #fff; border-bottom: 4px solid var(--fill-deep);
  transition: transform .06s, border-width .06s; width: 100%;
}
.btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn:disabled { background: var(--line); border-bottom-color: var(--line); color: var(--muted); }
.btn.ghost { background: var(--surface); color: var(--accent); border: 2px solid var(--line); border-bottom-width: 4px; }
.btn.good { background: var(--good-fill); border-bottom-color: var(--good-deep); }
.btn.bad { background: var(--bad-fill); border-bottom-color: var(--bad-deep); }
.btn.danger { background: var(--surface); color: var(--bad); border: 2px solid var(--line); border-bottom-width: 4px; }
.btn.sm { min-height: 44px; font-size: 15px; }
.link-btn { color: var(--accent); font-weight: 700; font-size: 15px; padding: 6px 2px; }

/* home */
.hero { display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: 20px; background: var(--fill); color: #fff; border-bottom: 5px solid var(--fill-deep); position: relative; overflow: hidden; }
.hero h2 { margin: 0; font-family: var(--font-display); font-size: 22px; line-height: 1.3; font-weight: 800; text-wrap: balance; }
.hero p { margin: 0; opacity: .88; font-size: 14px; }
.hero .tiles { position: absolute; right: -6px; top: 10px; display: flex; gap: 4px; transform: rotate(8deg); opacity: .22; pointer-events: none; }
.hero .tiles span { background: #fff; color: #1b3c97; font-family: var(--font-display); font-weight: 900; padding: 2px 8px; border-radius: 7px; font-size: 18px; }
.hero .row { display: flex; gap: 10px; flex-wrap: wrap; }
.hero .btn { background: #fff; color: #1b3c97; border-bottom-color: rgba(0,0,0,.22); flex: 1 1 140px; width: auto; white-space: nowrap; font-size: 16px; gap: 6px; padding: 0 12px; }
.hero .btn.alt { background: rgba(255,255,255,.14); color: #fff; border-bottom-color: rgba(0,0,0,.2); }
.hero .link-btn { color: #fff; text-decoration: underline; text-underline-offset: 3px; align-self: flex-start; font-size: 14px; }

.sec-title { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 -8px; font-size: 13px; font-weight: 800; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.deck-list { display: flex; flex-direction: column; gap: 12px; }
.deck-card { text-align: left; width: 100%; display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: var(--r); background: var(--surface); border: 2px solid var(--line); border-bottom-width: 4px; }
.deck-card:active { transform: translateY(2px); border-bottom-width: 2px; }
.deck-card .top { display: flex; align-items: center; gap: 8px; }
.deck-card .name { font-weight: 800; font-size: 17px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 9px; flex: none; }
.deck-card .meta { font-size: 14px; color: var(--muted); display: flex; gap: 12px; font-variant-numeric: tabular-nums; }
.meter { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; display: flex; }
.meter i { display: block; height: 100%; }
.meter .m1 { background: var(--good); }
.meter .m2 { background: var(--accent); opacity: .55; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; border: 2px dashed var(--line); border-radius: var(--r); font-size: 15px; }

/* deck */
.deck-head { display: flex; flex-direction: column; gap: 10px; }
.deck-head .counts { display: flex; gap: 8px; flex-wrap: wrap; }
.stat-pill { display: inline-flex; gap: 6px; align-items: baseline; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1.5px solid var(--line); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stat-pill b { color: var(--ink); font-size: 16px; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: 0; background: var(--line); }
.legend .l1::before { background: var(--good); }
.legend .l2::before { background: var(--accent); opacity: .55; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode { text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: var(--r); background: var(--surface); border: 2px solid var(--line); border-bottom-width: 4px; min-width: 0; }
.mode:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.mode .ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); margin-bottom: 6px; font-size: 20px; }
.mode b { font-size: 16px; font-weight: 800; }
.mode small { font-size: 13px; color: var(--muted); line-height: 1.35; }
.mode:disabled { opacity: .5; }
.settings { display: flex; flex-direction: column; gap: 2px; background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 4px 14px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }
.set-row + .set-row { border-top: 1.5px solid var(--line); }
.set-row label, .set-row > span { font-weight: 700; font-size: 15px; }
.seg { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { padding: 6px 12px; border-radius: 8px; font-weight: 800; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.switch { width: 50px; height: 30px; border-radius: 99px; background: var(--line); position: relative; transition: background .15s; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--good-fill); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.word-list { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); overflow: hidden; }
.word-row { display: grid; grid-template-columns: 10px minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: center; padding: 11px 14px; font-size: 15px; }
.word-row + .word-row { border-top: 1.5px solid var(--line); }
.word-row .t { font-weight: 700; overflow-wrap: anywhere; }
.word-row .m { color: var(--muted); overflow-wrap: anywhere; }
.dot { width: 10px; height: 10px; border-radius: 3px; background: var(--line); }
.dot.lv1 { background: var(--accent); opacity: .55; }
.dot.lv2 { background: var(--good); }
.more { width: 100%; padding: 12px; font-weight: 800; color: var(--accent); border-top: 1.5px solid var(--line); font-size: 15px; }

/* lesson */
.lesson-top { display: flex; align-items: center; gap: 12px; padding-block: 12px; min-height: 64px; }
.progress { flex: 1; height: 16px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--good-fill); border-radius: 99px; transition: width .35s cubic-bezier(.3,1.4,.6,1); position: relative; min-width: 16px; }
.progress i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 4px; height: 4px; border-radius: 99px; background: rgba(255,255,255,.35); }
.combo { font-family: var(--font-display); font-weight: 900; color: var(--gold); font-size: 16px; min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }
.timer { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
.q-body { flex: 1; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 18px; padding-block: 4px 20px; }
.q-label { margin: 0; font-family: var(--font-display); font-size: 22px; font-weight: 800; line-height: 1.3; text-wrap: balance; }
.q-retry { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; color: var(--bad); letter-spacing: .04em; }
.prompt { display: flex; align-items: center; gap: 12px; }
.prompt .big { font-family: var(--font-display); font-size: 30px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; min-width: 0; }
.prompt .big.ko { font-family: "Jua", var(--font-body); font-weight: 400; font-size: 28px; }
.prompt .big.long { font-size: 22px; }
.bubble { position: relative; flex: none; padding: 14px 16px; border: 2px solid var(--line); border-radius: 16px; background: var(--surface); font-size: 18px; font-weight: 700; line-height: 1.45; min-width: 0; overflow-wrap: anywhere; display: flex; gap: 10px; align-items: flex-start; }
.speak { width: 48px; height: 48px; border-radius: 14px; background: var(--fill); color: #fff; display: grid; place-items: center; border-bottom: 4px solid var(--fill-deep); flex: none; font-size: 20px; }
.speak:active { transform: translateY(2px); border-bottom-width: 2px; }
.speak.sm { width: 36px; height: 36px; border-radius: 10px; font-size: 16px; border-bottom-width: 3px; }
.speak.slow { background: var(--surface); color: var(--accent); border: 2px solid var(--line); border-bottom-width: 4px; }
.prompt .bubble { flex: 1; }
.listen-row { display: flex; justify-content: center; gap: 14px; padding: 12px 0; }
.listen-row .speak { width: 88px; height: 88px; border-radius: 24px; font-size: 36px; }
.listen-row .speak.slow { width: 64px; height: 64px; border-radius: 18px; font-size: 26px; align-self: flex-end; }

.tile {
  background: var(--tile); border: 2px solid var(--tile-edge); border-bottom-width: 4px; border-radius: 12px;
  padding: 9px 13px; font-weight: 700; font-size: 17px; line-height: 1.3; color: var(--ink);
  transition: transform .06s; touch-action: manipulation; user-select: none;
}
.tile:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }
.tile.ko { font-family: "IBM Plex Sans KR", var(--font-body); font-weight: 600; }
.options { display: flex; flex-direction: column; gap: 10px; }
.options .tile { text-align: left; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 14px; font-size: 17px; }
.options .tile .n { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--tile-edge); display: grid; place-items: center; font-size: 13px; color: var(--muted); flex: none; }
.tile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.tile[aria-pressed="true"] .n { border-color: var(--accent); color: var(--accent); }
.tile.right { border-color: var(--good); background: var(--good-soft); color: var(--good-deep); }
.tile.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad-deep); }
:root[data-theme="dark"] .tile.right, :root[data-theme="dark"] .tile.wrong { color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tile.right, :root:not([data-theme="light"]) .tile.wrong { color: var(--ink); } }

.answer-zone {
  min-height: 118px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; padding: 6px 0 10px;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 54px, var(--line) 54px, var(--line) 56px);
}
.answer-zone.letters { min-height: 64px; background-image: none; justify-content: center; gap: 6px; padding: 8px 0; }
.slot { width: 38px; height: 50px; border-bottom: 3px solid var(--line); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 24px; }
.slot.filled { border-color: var(--accent); }
.letters .tile { width: 42px; height: 50px; padding: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 22px; }
.bank { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.bank .tile.used { background: var(--line); border-color: var(--line); color: transparent; pointer-events: none; }
.type-box { width: 100%; min-height: 120px; padding: 14px; border-radius: var(--r); border: 2px solid var(--line); background: var(--surface); font-size: 20px; font-weight: 700; resize: none; }
.type-box:focus { outline: none; border-color: var(--accent); }
.hint { font-size: 14px; color: var(--muted); }

.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.match .tile { min-height: 62px; padding: 8px 10px; font-size: 16px; text-align: center; overflow-wrap: anywhere; display: grid; place-items: center; }
.match .tile.done { opacity: 0; pointer-events: none; transition: opacity .35s .25s; }
.match .tile.done.right { opacity: 1; transition: none; }
.shake { animation: shake .32s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

.foot { border-top: 2px solid var(--line); padding-block: 14px 16px; display: flex; flex-direction: column; gap: 12px; background: var(--bg); }
.foot .row { display: flex; gap: 10px; }
.foot .row .btn.ghost { flex: 0 0 auto; width: auto; padding: 0 16px; }
.foot.ok { background: var(--good-soft); border-color: transparent; }
.foot.bad { background: var(--bad-soft); border-color: transparent; }
.fb { display: flex; gap: 12px; align-items: flex-start; animation: rise .22s ease-out; }
.fb .badge { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); flex: none; font-size: 24px; }
.foot.ok .badge { color: var(--good); }
.foot.bad .badge { color: var(--bad); }
.fb .txt { flex: 1; min-width: 0; }
.fb h3 { margin: 0; font-family: var(--font-display); font-size: 20px; font-weight: 900; }
.foot.ok h3 { color: var(--good-deep); }
.foot.bad h3 { color: var(--bad-deep); }
.fb p { margin: 2px 0 0; font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
.fb p small { display: block; font-weight: 500; color: var(--muted); font-size: 14px; }
.fb .speak { margin-left: auto; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }
@keyframes drop { from { transform: translateY(-14px); opacity: 0; } }
:root[data-theme="dark"] .foot.ok h3, :root[data-theme="dark"] .foot.bad h3 { color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .foot.ok h3, :root:not([data-theme="light"]) .foot.bad h3 { color: var(--ink); } }

/* flashcards */
.flash-stage { flex: 1; display: flex; align-items: center; justify-content: center; perspective: 1200px; padding: 8px 0; min-height: 300px; }
.card { width: 100%; height: min(58vh, 420px); position: relative; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,.9,.4,1); touch-action: pan-y; }
.card.flipped { transform: rotateY(180deg); }
.card .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 22px; background: var(--surface); border: 2px solid var(--line); border-bottom-width: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
.card .back { transform: rotateY(180deg); background: var(--accent-soft); border-color: var(--accent); }
.card .face .w { font-family: var(--font-display); font-size: 34px; font-weight: 900; line-height: 1.25; overflow-wrap: anywhere; }
.card .face .w.long { font-size: 23px; }
.card .back .w { font-family: "Jua", var(--font-body); font-weight: 400; color: var(--accent-deep); }
.card .face small { color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: .04em; }
.card .swipe-tag { position: absolute; top: 18px; padding: 4px 12px; border-radius: 8px; font-weight: 900; font-size: 15px; opacity: 0; border: 2.5px solid; }
.card .swipe-tag.k { right: 18px; color: var(--good); }
.card .swipe-tag.a { left: 18px; color: var(--bad); }
:root[data-theme="dark"] .card .back .w { color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .card .back .w { color: var(--ink); } }

/* result */
.result-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 24px 0 8px; }
.trophy { width: 96px; height: 96px; border-radius: 28px; background: var(--gold); color: #fff; display: grid; place-items: center; font-size: 52px; border-bottom: 6px solid rgba(0,0,0,.2); transform: rotate(-6deg); animation: pop .5s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { from { transform: scale(.4) rotate(-30deg); opacity: 0; } }
.result-hero h2 { margin: 8px 0 0; font-family: var(--font-display); font-size: 28px; font-weight: 900; }

.stat-tile { border-radius: var(--r); border: 2px solid var(--gold); overflow: hidden; text-align: center; background: var(--surface); }
.stat-tile span { display: block; font-size: 12px; font-weight: 900; letter-spacing: .06em; color: #fff; background: var(--gold); padding: 3px 0; }

@keyframes fade { from { opacity: 0; } }

.sheet h3 { margin: 0; font-family: var(--font-display); font-size: 21px; font-weight: 900; }
.sheet p { margin: 0; color: var(--muted); font-size: 15px; }
.sheet .stack { display: flex; flex-direction: column; gap: 10px; }
.guide-table { width: 100%; border-collapse: collapse; font-size: 14px; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; }
.guide-table th, .guide-table td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; }
.guide-table th { background: var(--bg); color: var(--muted); font-weight: 800; font-size: 12px; width: 28px; text-align: center; }
.guide-table tr:first-child td { font-weight: 800; background: var(--accent-soft); color: var(--accent); }
.guide-list { margin: 0; padding-left: 20px; color: var(--ink); font-size: 15px; display: flex; flex-direction: column; gap: 6px; }
.guide-list code { background: var(--bg); padding: 1px 6px; border-radius: 6px; font-size: 13px; }
.toast { position: absolute; left: 16px; right: 16px; top: 12px; z-index: 30; pointer-events: none; background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 12px; font-weight: 700; font-size: 15px; animation: drop .2s ease-out; box-shadow: 0 6px 20px rgba(0,0,0,.25); }

/* paste */
.field { display: flex; flex-direction: column; gap: 6px; }

.field input, .field textarea { width: 100%; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; font-size: 16px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

  #app { border-left: 2px solid var(--line); border-right: 2px solid var(--line); }
}

<body>
<div id="app"></div>
<input type="file" id="file-in" accept=".xlsx,.xls,.xlsm,.ods,.csv,.tsv,.txt" hidden>
<script src="vendor/xlsx.full.min.js"></script>
<script>
'use strict';

/* ---------- storage ---------- */
const KEY = 'wordtile.v1';
function loadDB() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} }

/* ---------- small utils ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const uid = () => Math.random().toString(36).slice(2, 10);
const HANGUL = /[ㄱ-ㆎ가-힣]/;
const LATIN = /[A-Za-z]/;
const words = s => String(s).trim().split(/\s+/).filter(Boolean);
const cleanTok = t => t.replace(/^[^\p{L}\p{N}']+|[^\p{L}\p{N}']+$/gu, '');
const normTok = t => cleanTok(t.replace(/[’‘`]/g, "'")).toLowerCase();
const normText = s => words(String(s).replace(/[’‘`]/g, "'")).map(normTok).filter(Boolean).join(' ');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}

/* ---------- icons ---------- */
const svg = (d) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const I = {
  back: svg('<path d="M15 5l-7 7 7 7"/>'),
  close: svg('<path d="M6 6l12 12M18 6L6 18"/>'),
  speaker: svg('<path class="f" d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/>'),
  slow: svg('<path class="f" d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M16 12h5"/>'),
  upload: svg('<path d="M12 15V4M7 9l5-5 5 5M5 20h14"/>'),
  paste: svg('<rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 3h6v3H9zM9 11h6M9 15h4"/>'),
  flame: svg('<path class="f" d="M12 2c.8 3.6 5.5 6 5.5 11.2a5.5 5.5 0 01-11 0c0-2.3 1.1-3.9 2.2-5 .3 2 1.3 3 2.1 3.3C9.7 8.2 10.8 5 12 2z"/>'),
  bolt: svg('<path class="f" d="M13.5 2L4 14h7l-1.5 8L19 10h-7l1.5-8z"/>'),
  trash: svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'),
  cards: svg('<rect x="3" y="7" width="13" height="14" rx="2.5"/><path d="M8 3.5h10.5A2.5 2.5 0 0121 6v11"/>'),
  match: svg('<rect x="3" y="4" width="7" height="6" rx="1.5"/><rect x="14" y="14" width="7" height="6" rx="1.5"/><path d="M10 7h3.5a3 3 0 013 3v4M14 17h-3.5a3 3 0 01-3-3v-4"/>'),
  choice: svg('<circle cx="6" cy="7" r="2.2"/><circle class="f" cx="6" cy="17" r="2.6"/><path d="M11.5 7H20M11.5 17H20"/>'),
  puzzle: svg('<rect x="2.5" y="5" width="8" height="5.5" rx="1.6"/><rect x="12.5" y="5" width="9" height="5.5" rx="1.6"/><rect x="2.5" y="13.5" width="11" height="5.5" rx="1.6"/>'),
  pencil: svg('<path d="M4 20l1.2-4.3L16 4.9l3.1 3.1L8.3 18.8 4 20zM14 7l3 3"/>'),
  redo: svg('<path d="M20 12a8 8 0 11-2.4-5.7M20 4v5h-5"/>'),
  check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  x: svg('<path d="M7 7l10 10M17 7L7 17"/>'),
  star: svg('<path class="f" d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/>'),
  play: svg('<path class="f" d="M7 4.5v15l12.5-7.5z"/>'),
  file: svg('<path d="M6 3h8l5 5v13H6zM14 3v5h5M9 13h7M9 17h7"/>'),
  help: svg('<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-.9.6-1.5 1.2-1.5 2.3M12 17h.01"/>'),
  clock: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
};

/* ---------- speech & sound ---------- */
const TTS = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
let enVoice = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    enVoice = vs.find(v => /^en[-_]US/i.test(v.lang) && /google|natural|samantha/i.test(v.name)) || vs.find(v => /^en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  } catch (e) {}
}
if (TTS) { pickVoice(); try { speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch (e) {} }
function speak(text, slow) {
  if (!TTS || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const ko = HANGUL.test(text) && !LATIN.test(text);
    u.lang = ko ? 'ko-KR' : 'en-US';
    if (!ko && enVoice) u.voice = enVoice;
    u.rate = slow ? 0.62 : 0.92;
    speechSynthesis.speak(u);
  } catch (e) {}
}
let actx = null;
function chime(ok) {
  if (!DB.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    (ok ? [[784, 0], [1047, 0.09]] : [[330, 0], [247, 0.11]]).forEach(([f, d]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = ok ? 'sine' : 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(0.2, t + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.22);
      o.connect(g).connect(actx.destination); o.start(t + d); o.stop(t + d + 0.25);
    });
  } catch (e) {}
}
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

/* ---------- parsing spreadsheets & text ---------- */
const hk = s => String(s).toLowerCase().replace(/[\s_\-.:()\[\]\/·]/g, '');
const H_NO = /^(no|num|number|번호|순번|순서|#|index|id|day|일차)$/;
const H_TERM = /^(english|eng|en|word|words|term|terms|vocab|vocabulary|sentence|sentences|phrase|phrases|expression|expressions|영어|영단어|단어|문장|영문|영어문장|표현|어휘|원문|front|question)$/;
const H_MEAN = /^(korean|kor|ko|meaning|meanings|mean|definition|definitions|def|translation|뜻|의미|해석|한국어|한글|번역|우리말|한글뜻|back|answer)$/;
const H_EX = /^(example|examples|ex|examplesentence|예문|예시|예시문장|예문영어)$/;
const H_EXM = /^(examplemeaning|exampletranslation|예문해석|예문뜻|예문번역|예시해석)$/;
const cellStr = v => v == null ? '' : String(v).replace(/\s+/g, ' ').trim();

function parseTable(rows) {
  rows = rows.map(r => (r || []).map(cellStr)).filter(r => r.some(Boolean));
  if (!rows.length) return [];
  const width = Math.max(...rows.map(r => r.length));
  const cols = {};
  rows[0].forEach((c, i) => {
    const h = hk(c); if (!h) return;
    if (H_NO.test(h)) cols.no ??= i;
    else if (H_EXM.test(h)) cols.exm ??= i;
    else if (H_EX.test(h)) cols.ex ??= i;
    else if (H_TERM.test(h)) cols.t ??= i;
    else if (H_MEAN.test(h)) cols.m ??= i;
  });
  const hasHead = Object.keys(cols).length > 0;
  const body = hasHead ? rows.slice(1) : rows;
  const st = [];
  for (let i = 0; i < width; i++) {
    let n = 0, num = 0, ko = 0, en = 0;
    for (const r of body) { const v = r[i] || ''; if (!v) continue; n++; if (/^\d+[.)]?$/.test(v)) num++; if (HANGUL.test(v)) ko++; if (LATIN.test(v)) en++; }
    st.push({ n, num, ko, en });
  }
  const taken = new Set(Object.values(cols));
  const free = () => st.map((s, i) => i).filter(i => !taken.has(i) && st[i].n > 0 && st[i].num < st[i].n * 0.8);
  if (cols.t == null) {
    let best = null;
    for (const i of free()) { const sc = st[i].en - st[i].ko; if (best == null || sc > st[best].en - st[best].ko) best = i; }
    if (best != null) { cols.t = best; taken.add(best); }
  }
  if (cols.m == null) {
    const f = free();
    let best = null;
    for (const i of f) if (st[i].ko > 0 && (best == null || st[i].ko > st[best].ko)) best = i;
    if (best == null) best = f.find(i => i > cols.t) ?? f[0];
    if (best != null) cols.m = best;
  }
  if (cols.t == null) return [];
  const out = [];
  for (const r of body) {
    let t = r[cols.t] || '', m = cols.m != null ? (r[cols.m] || '') : '';
    if (HANGUL.test(t) && !LATIN.test(t) && LATIN.test(m) && !HANGUL.test(m)) [t, m] = [m, t];
    if (t) out.push({ t, m });
    if (cols.ex != null && r[cols.ex]) out.push({ t: r[cols.ex], m: cols.exm != null ? (r[cols.exm] || '') : '' });
  }
  return out;
}

function parseText(text) {
  const out = [];
  for (let line of String(text).split(/\r?\n/)) {
    line = line.trim().replace(/^\d+[.)]\s+/, '');
    if (!line) continue;
    let t = '', m = '';
    if (line.includes('\t')) { const p = line.split('\t').map(s => s.trim()).filter(Boolean); t = p[0] || ''; m = p.slice(1).join(' ') || ''; }
    else {
      const d = [' - ', ' – ', ' — ', ' = ', ' : ', ' | ', '|'].find(x => line.includes(x));
      if (d) { const k = line.indexOf(d); t = line.slice(0, k).trim(); m = line.slice(k + d.length).trim(); }
      else {
        const k = line.search(HANGUL);
        if (k > 0) { t = line.slice(0, k).replace(/[\s,;:=\-–]+$/, '').trim(); m = line.slice(k).trim(); }
        else if (k === 0 && LATIN.test(line)) {
          const j = line.search(LATIN); m = line.slice(0, j).replace(/[\s,;:=\-–]+$/, '').trim(); t = line.slice(j).trim();
        } else t = line;
      }
    }
    if (HANGUL.test(t) && !LATIN.test(t) && LATIN.test(m)) [t, m] = [m, t];
    if (t) out.push({ t, m });
  }
  return out;
}

function kindOf(t) { const n = words(t).length; return (n >= 4 || (n >= 3 && /[.?!]$/.test(t))) ? 's' : 'w'; }
function makeItems(pairs) {
  const seen = new Set(), items = [];
  for (const p of pairs) {
    const key = p.t.toLowerCase();
    if (seen.has(key)) continue; seen.add(key);
    items.push({ id: uid(), t: p.t, m: p.m, k: kindOf(p.t), c: 0, w: 0, last: 0 });
  }
  return items;
}
function makeDeck(name, pairs, sample) { return { id: uid(), name, items: makeItems(pairs), created: Date.now(), sample: !!sample }; }

async function readFile(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const base = file.name.replace(/\.[^.]+$/, '') || '새 단어장';
  const buf = await file.arrayBuffer();
  if (ext === 'txt' || ext === 'csv' || ext === 'tsv') {
    let text;
    try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
    catch (e) { try { text = new TextDecoder('euc-kr').decode(buf); } catch (e2) { text = new TextDecoder().decode(buf); } }
    text = text.replace(/^﻿/, '');
    if (ext === 'txt') return [{ name: base, pairs: parseText(text) }];
    if (typeof XLSX === 'undefined') return [{ name: base, pairs: parseText(text.replace(/,/g, '\t')) }];
    const wb = XLSX.read(text, { type: 'string', FS: ext === 'tsv' ? '\t' : undefined });
    return sheetsOf(wb, base);
  }
  if (typeof XLSX === 'undefined') throw new Error('noxlsx');
  return sheetsOf(XLSX.read(buf, { type: 'array' }), base);
}
function sheetsOf(wb, base) {
  return wb.SheetNames.map(n => ({
    name: wb.SheetNames.length > 1 ? `${base} · ${n}` : base,
    sheet: n,
    pairs: parseTable(XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '', raw: false, blankrows: false })),
  })).filter(s => s.pairs.length);
}

/* ---------- data ---------- */
const SAMPLE = [
  ['abandon', '버리다, 포기하다'], ['accurate', '정확한'], ['borrow', '빌리다'], ['curious', '호기심 많은'],
  ['decline', '거절하다; 감소하다'], ['eager', '열망하는'], ['frequent', '잦은, 빈번한'], ['generous', '관대한, 너그러운'],
  ['habit', '습관'], ['improve', '개선하다, 나아지다'], ['journey', '여행, 여정'], ['necessary', '필요한'],
  ['opportunity', '기회'], ['patient', '참을성 있는; 환자'], ['give up', '포기하다'], ['look forward to', '~을 고대하다'],
  ['I am looking forward to seeing you again.', '당신을 다시 만나기를 고대하고 있어요.'],
  ['She borrowed a book from the library.', '그녀는 도서관에서 책을 빌렸다.'],
  ['Practice makes perfect.', '연습이 완벽을 만든다.'],
  ['It is necessary to sleep well before the exam.', '시험 전에 잘 자는 것이 필요하다.'],
  ['He is always eager to learn new things.', '그는 항상 새로운 것을 배우고 싶어 한다.'],
  ['This is a great opportunity for us.', '이것은 우리에게 좋은 기회이다.'],
  ["Don't give up on your dream.", '꿈을 포기하지 마.'],
  ['The weather report was not accurate.', '일기 예보가 정확하지 않았다.'],
].map(([t, m]) => ({ t, m }));

let DB = loadDB();
if (!DB || !Array.isArray(DB.decks)) DB = { decks: [], settings: {}, streak: { last: null, days: 0 }, xp: 0 };
DB.settings = Object.assign({ count: 10, sound: true, autoplay: true }, DB.settings);
DB.streak = DB.streak || { last: null, days: 0 };
if (!DB.seeded) { DB.decks.push(makeDeck('예시 단어장', SAMPLE, true)); DB.seeded = true; save(); }

const deckById = id => DB.decks.find(d => d.id === id);
const level = it => (it.c >= 3 && it.c >= it.w * 2) ? 2 : (it.c + it.w > 0 ? 1 : 0);
function deckStats(d) {
  const s = { w: 0, s: 0, l0: 0, l1: 0, l2: 0, wrong: 0, n: d.items.length };
  for (const it of d.items) { s[it.k]++; s['l' + level(it)]++; if (it.w > 0 && level(it) < 2) s.wrong++; }
  return s;
}
function streakNow() {
  const s = DB.streak; if (!s.last) return 0;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yk = y.getFullYear() + '-' + (y.getMonth() + 1) + '-' + y.getDate();
  return (s.last === today() || s.last === yk) ? s.days : 0;
}
function bumpStreak() {
  const s = DB.streak, t = today();
  if (s.last === t) return;
  s.days = streakNow() > 0 ? s.days + 1 : 1; s.last = t;
}

/* ---------- ui state ---------- */
const UI = { screen: 'home', deckId: null, modal: null, showAll: false, toast: null };
let L = null;   // running lesson
let F = null;   // running flashcards
let R = null;   // last result
let timerId = null, toastId = null;

function toast(msg) {
  UI.toast = msg; renderToast();
  clearTimeout(toastId); toastId = setTimeout(() => { UI.toast = null; renderToast(); }, 3200);
}
function renderToast() {
  let el = $('#toast');
  if (!UI.toast) { el && el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); $('#app').appendChild(el); }
  el.textContent = UI.toast;
}
function go(screen, extra) {
  Object.assign(UI, { screen, modal: null }, extra || {});
  if (screen === 'lesson' || screen === 'flash') { UI.toast = null; clearTimeout(toastId); }
  if (screen !== 'home') { try { history.pushState({ s: screen }, ''); } catch (e) {} }
  render(true);
}

/* ---------- views: home ---------- */
function homeView() {
  const st = streakNow();
  const decks = DB.decks.slice().sort((a, b) => (b.used || b.created) - (a.used || a.created));
  return `<section class="screen">

/* ---------- question building ---------- */
const spellable = t => /^[A-Za-z][A-Za-z'-]{2,11}$/.test(t);
function kindsFor(it) {
  const ks = [];
  if (it.k === 'w') {
    if (!it.m) return ks;
    ks.push('mc-en', 'mc-ko', 'type');
    if (spellable(it.t)) ks.push('spell');
  } else {
    if (words(it.t).length < 2) return it.m ? ['mc-en'] : ks;
    if (it.m) { ks.push('build-en', 'mc-en'); if (words(it.m).length >= 2) ks.push('build-ko'); }
    else ks.push('order');
    if (TTS) ks.push('listen');
  }
  return ks;
}
function optionsFor(it, pool, field) {
  const val = it[field];
  const same = shuffle(pool.filter(p => p.id !== it.id && p[field] && p[field] !== val && p.k === it.k));
  const other = shuffle(pool.filter(p => p.id !== it.id && p[field] && p[field] !== val && p.k !== it.k));
  const opts = [val];
  for (const p of same.concat(other)) { if (opts.length >= 4) break; if (!opts.includes(p[field])) opts.push(p[field]); }
  return shuffle(opts);
}
function tilesFrom(text) { return words(text).map(cleanTok).filter(Boolean); }
function bankFor(text, pool, field, it) {
  const tiles = tilesFrom(text);
  const have = new Set(tiles.map(normTok));
  const extra = [];
  if (tiles.length <= 10) {
    const cand = shuffle(pool.filter(p => p.id !== it.id && p[field]).flatMap(p => tilesFrom(p[field])));
    for (const c of cand) { if (extra.length >= (tiles.length < 5 ? 2 : 3)) break; const k = normTok(c); if (!have.has(k)) { have.add(k); extra.push(c); } }
  }
  return { answer: tiles, bank: shuffle(tiles.concat(extra)).map((t, i) => ({ i, t })) };
}
function letterBank(word) {
  const letters = word.split('');
  const pool = 'abcdeghilmnoprstuwy'.split('').filter(c => !word.toLowerCase().includes(c));
  const extra = shuffle(pool).slice(0, word.length > 7 ? 2 : 3);
  return shuffle(letters.concat(extra)).map((t, i) => ({ i, t }));
}
function makeQ(kind, it, pool) {
  const q = { kind, item: it, built: [], sel: null, typed: '' };
  if (kind === 'mc-en') q.opts = optionsFor(it, pool, 'm');
  else if (kind === 'mc-ko') q.opts = optionsFor(it, pool, 't');
  else if (kind === 'build-en' || kind === 'listen' || kind === 'order') Object.assign(q, bankFor(it.t, pool, 't', it));
  else if (kind === 'build-ko') Object.assign(q, bankFor(it.m, pool, 'm', it));
  else if (kind === 'spell') { q.answer = it.t.split(''); q.bank = letterBank(it.t); }
  if ((kind === 'mc-en' || kind === 'mc-ko') && q.opts.length < 2) return makeQ(it.k === 'w' ? 'type' : 'build-en', it, pool);
  return q;
}
function makeMatch(items) {
  const pairs = items.slice(0, 5);
  return { kind: 'match', item: null, pairs, left: shuffle(pairs.map(p => p.id)), right: shuffle(pairs.map(p => p.id)), done: new Set(), sel: null, flash: null, mistakes: 0 };
}
function weightOf(it) { return 1 + it.w * 2 + (it.c + it.w === 0 ? 1.5 : 0) - Math.min(it.c, 5) * 0.25 + Math.min((Date.now() - (it.last || 0)) / 864e5, 7) * 0.1; }
function choose(items, n) {
  const arr = items.map(it => ({ it, k: Math.random() ** (1 / Math.max(weightOf(it), 0.1)) }));
  arr.sort((a, b) => b.k - a.k);
  return arr.slice(0, n || arr.length).map(a => a.it);
}

function buildQueue(mode, d, forced) {
  const pool = d.items;
  const n = DB.settings.count || 9999;
  const quizzable = pool.filter(it => kindsFor(it).length);
  const wordsM = pool.filter(it => it.k === 'w' && it.m);
  const short = pool.filter(it => it.m && it.t.length <= 40 && it.m.length <= 40);
  const pairable = short.filter(it => it.k === 'w').length >= 4 ? short.filter(it => it.k === 'w') : short;
  let q = [];
  if (mode === 'match') {
    const items = choose(pairable.length >= 3 ? pairable : pool.filter(i => i.m), Math.max(n, 5));
    for (let i = 0; i < items.length; i += 5) {
      let chunk = items.slice(i, i + 5);
      if (chunk.length < 3) chunk = chunk.concat(shuffle(items.slice(0, i)).slice(0, 3 - chunk.length));
      q.push(makeMatch(chunk));
    }
    return q;
  }
  let items, kinds;
  if (mode === 'mc') { items = choose(pool.filter(i => i.m), n); kinds = it => ['mc-en', 'mc-ko'].filter(k => it.k === 'w' || k === 'mc-en'); }
  else if (mode === 'build') { items = choose(pool.filter(i => i.k === 's' && words(i.t).length >= 2), n); kinds = it => kindsFor(it).filter(k => k !== 'mc-en'); }
  else if (mode === 'spell') { items = choose(wordsM, n); kinds = it => kindsFor(it).filter(k => k === 'spell' || k === 'type'); }
  else if (mode === 'review') { items = choose(pool.filter(i => i.w > 0 && level(i) < 2), n); kinds = it => kindsFor(it).filter(k => k !== 'mc-en' || it.k === 's'); }
  else { items = forced ? forced.filter(it => kindsFor(it).length) : choose(quizzable, n); kinds = kindsFor; }
  for (const it of items) {
    let ks = kinds(it); if (!ks.length) ks = kindsFor(it); if (!ks.length) continue;
    let k;
    if (mode === 'mixed' && it.c + it.w === 0) k = ks.includes('mc-en') && it.k === 'w' ? 'mc-en' : (ks.includes('build-en') ? 'build-en' : ks[0]);
    else k = pick(ks);
    q.push(makeQ(k, it, pool));
  }
  if (mode === 'mixed' && !forced && pairable.length >= 4 && q.length >= 6) {
    const lessonWords = items.filter(it => pairable.includes(it));
    const pairs = shuffle(lessonWords).concat(shuffle(pairable.filter(it => !lessonWords.includes(it)))).slice(0, 5);
    q.splice(Math.min(4, q.length), 0, makeMatch(pairs));
  }
  return q;
}

/* ---------- lesson runtime ---------- */
function startLesson(mode, forced) {
  const d = deckById(UI.deckId); if (!d) return;
  const queue = buildQueue(mode, d, forced);
  if (!queue.length) { toast('이 모드로 낼 수 있는 문제가 없어요. 뜻이 들어 있는지 확인해 주세요.'); return; }
  d.used = Date.now(); save();
  L = { mode, deckId: d.id, queue, idx: 0, total: queue.length, done: 0, firstOk: 0, xp: 0, combo: 0, best: 0, missed: new Map(), retries: {}, start: Date.now(), answered: false, ok: false, note: '' };
  go('lesson');
  autoSpeak();
  startTimer();
}
const curQ = () => L && L.queue[L.idx];
function record(it, ok) { if (!it) return; ok ? it.c++ : it.w++; it.last = Date.now(); }
function answerText(q) {
  const it = q.item;
  if (q.kind === 'mc-en' || q.kind === 'build-ko') return it.m;
  return it.t;
}
function submit(ok, note) {
  const q = curQ(); if (!q || L.answered) return;
  L.answered = true; L.ok = ok; L.note = note || '';
  if (ok) {
    L.done++; L.combo++; L.best = Math.max(L.best, L.combo);
    if (!q.retry) L.firstOk++;
    L.xp += q.retry ? 5 : 10;
    chime(true);
  } else {
    L.combo = 0; chime(false); buzz(140);
    if (q.item) L.missed.set(q.item.id, q.item);
    const id = q.item && q.item.id, r = L.retries[id] || 0;
    if (id && r < 2) { L.retries[id] = r + 1; const d = deckById(L.deckId); const nq = makeQ(q.kind, q.item, d ? d.items : [q.item]); nq.retry = true; L.queue.push(nq); }
    else L.done++;
  }
  if (q.item) record(q.item, ok);
  save();
  renderLesson();
  if (DB.settings.autoplay && q.item && ['mc-ko', 'type', 'spell', 'build-en', 'order'].includes(q.kind)) speak(q.item.t);
}
function nextQ() {
  if (!L) return;
  L.idx++; L.answered = false; L.ok = false; L.note = '';
  if (L.idx >= L.queue.length) return finishLesson();
  renderLesson(true);
  autoSpeak();
}
function autoSpeak() {
  const q = curQ(); if (!q || !q.item || !DB.settings.autoplay) return;
  if (['mc-en', 'build-ko', 'listen'].includes(q.kind)) setTimeout(() => speak(q.item.t), 250);
}
function finishLesson() {
  stopTimer();
  const d = deckById(L.deckId);
  bumpStreak(); DB.xp += L.xp; save();
  R = { mode: L.mode, deckId: L.deckId, total: L.total, firstOk: L.firstOk, xp: L.xp, best: L.best, time: Date.now() - L.start, missed: [...L.missed.values()], deckName: d ? d.name : '' };
  L = null;
  try { history.replaceState({ s: 'result' }, ''); } catch (e) {}
  UI.screen = 'result'; render(true);
}
function startTimer() { stopTimer(); timerId = setInterval(() => { const el = $('#timer'); if (el && L) el.textContent = fmtTime(Date.now() - L.start); }, 1000); }
function stopTimer() { clearInterval(timerId); timerId = null; }
const fmtTime = ms => { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

/* checks */
function canCheck(q) {
  if (q.kind === 'mc-en' || q.kind === 'mc-ko') return q.sel != null;
  if (q.kind === 'type') return q.typed.trim().length > 0;
  if (q.kind === 'match') return false;
  return q.built.length > 0;
}
function check() {
  const q = curQ(); if (!q || L.answered || !canCheck(q)) return;
  if (q.kind === 'mc-en' || q.kind === 'mc-ko') return submit(q.opts[q.sel] === answerText(q));
  if (q.kind === 'type') {
    const got = normText(q.typed), want = normText(q.item.t);
    if (got === want) return submit(true);
    if (want.length >= 4 && lev(got, want) === 1) return submit(true, '오타가 하나 있어요');
    return submit(false);
  }
  if (q.kind === 'spell') return submit(q.built.map(i => q.bank[i].t).join('').toLowerCase() === q.item.t.toLowerCase());
  const got = q.built.map(i => normTok(q.bank[i].t)).join(' ');
  const want = q.answer.map(normTok).join(' ');
  submit(got === want);
}
function giveUp() { const q = curQ(); if (q && !L.answered) submit(false); }

function matchTap(side, id) {
  const q = curQ(); if (!q || q.kind !== 'match' || L.answered || q.done.has(id) || q.flash) return;
  if (!q.sel || q.sel.side === side) { q.sel = { side, id }; if (side === 'l' && DB.settings.autoplay) speak(q.pairs.find(p => p.id === id).t); renderLesson(); return; }
  const a = q.sel.id, b = id;
  q.sel = null;
  const find = x => q.pairs.find(p => p.id === x);
  if (a === b) {
    q.done.add(a); q.flash = { ids: [a], side: null, ok: true }; chime(true);
    if (!L.missed.has(a)) record(find(a), true);
  } else {
    q.mistakes++; q.flash = { ok: false, l: side === 'l' ? b : a, r: side === 'r' ? b : a }; chime(false); buzz(100);
    const lItem = find(q.flash.l); if (lItem) { record(lItem, false); L.missed.set(lItem.id, lItem); }
  }
  save();
  renderLesson();
  setTimeout(() => {
    if (!L || curQ() !== q) return;
    q.flash = null;
    if (q.done.size === q.pairs.length) {
      L.answered = true; L.ok = true; L.done++; L.combo++; L.best = Math.max(L.best, L.combo);
      if (q.mistakes === 0) L.firstOk++;
      L.xp += q.mistakes === 0 ? 15 : 8;
      L.note = q.mistakes === 0 ? '한 번도 안 틀렸어요' : `${q.mistakes}번 헷갈렸어요`;
      if (L.mode === 'match') return nextQ();
    }
    renderLesson();
  }, a === b ? 380 : 520);
}

/* ---------- views: lesson ---------- */
const LABEL = {
  'mc-en': it => it.k === 's' ? '이 문장의 뜻은?' : '이 단어의 뜻은?',
  'mc-ko': () => '알맞은 영어를 고르세요',
  'build-en': () => '이 문장을 영어로 만들어 보세요',
  'build-ko': () => '이 문장을 우리말로 옮겨 보세요',
  'listen': () => '들리는 문장을 만들어 보세요',
  'order': () => '단어를 올바른 순서로 놓아 보세요',
  'spell': () => '철자를 맞춰 보세요',
  'type': () => '영어로 써 보세요',
  'match': () => '짝을 맞춰 보세요',
};
const bigCls = s => (String(s).length > 28 ? ' long' : '');
function lessonView() {
  const q = curQ();
  const pct = Math.max(L.done / L.total * 100, 0);
  const isMatchMode = L.mode === 'match';
  return `<section class="screen">
    <header class="lesson-top wrap">
      <button class="icon-btn" data-act="ask-quit" aria-label="그만하기">${I.close}</button>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${L.total}" aria-valuenow="${L.done}"><i style="width:${pct}%"></i></div>
      ${isMatchMode ? `<span class="timer" id="timer">${fmtTime(Date.now() - L.start)}</span>` : `<span class="combo" aria-label="연속 정답">${L.combo >= 2 ? '×' + L.combo : ''}</span>`}
    </header>
    <main class="q-body wrap" id="qbody">
      ${q.retry ? `<span class="q-retry">${I.redo}다시 풀어 볼까요</span>` : ''}
      <h2 class="q-label">${LABEL[q.kind](q.item)}</h2>
      ${questionBody(q)}
    </main>
    ${footView(q)}
  </section>`;
}
function questionBody(q) {
  const it = q.item, lock = L.answered ? 'disabled' : '';
  const spk = (t, sm) => TTS ? `<button class="speak${sm ? ' sm' : ''}" data-act="say" data-t="${esc(t)}" aria-label="발음 듣기">${I.speaker}</button>` : '';
  switch (q.kind) {
    case 'mc-en':
    case 'mc-ko': {
      const ans = answerText(q), en = q.kind === 'mc-en';
      const prompt = en
        ? `<div class="prompt">${spk(it.t)}<span class="big${bigCls(it.t)}">${esc(it.t)}</span></div>`
        : `<div class="prompt"><span class="big ko${bigCls(it.m)}">${esc(it.m)}</span></div>`;
      return prompt + `<div class="options">${q.opts.map((o, i) => {
        let cls = '';
        if (L.answered) { if (o === ans) cls = ' right'; else if (i === q.sel) cls = ' wrong'; }
        return `<button class="tile${en ? ' ko' : ''}${cls}" data-act="opt" data-i="${i}" aria-pressed="${q.sel === i && !L.answered}" ${lock}><span class="n">${i + 1}</span><span>${esc(o)}</span></button>`;
      }).join('')}</div>`;
    }
    case 'build-en':
    case 'build-ko':
    case 'listen':
    case 'order': {
      let prompt = '';
      if (q.kind === 'build-en') prompt = `<div class="bubble"><span>${esc(it.m)}</span></div>`;
      else if (q.kind === 'build-ko') prompt = `<div class="prompt">${spk(it.t)}<div class="bubble"><span>${esc(it.t)}</span></div></div>`;
      else if (q.kind === 'listen') prompt = `<div class="listen-row"><button class="speak" data-act="say" data-t="${esc(it.t)}" aria-label="듣기">${I.speaker}</button><button class="speak slow" data-act="say" data-slow="1" data-t="${esc(it.t)}" aria-label="천천히 듣기">${I.slow}</button></div>`;

        <div class="answer-zone" aria-label="내 답">${q.built.map((bi, pos) => `<button class="tile${ko}" data-act="unbuild" data-pos="${pos}" ${lock}>${esc(q.bank[bi].t)}</button>`).join('')}</div>
        <div class="bank">${q.bank.map(b => `<button class="tile${ko}${q.built.includes(b.i) ? ' used' : ''}" data-act="build" data-i="${b.i}" ${lock} ${q.built.includes(b.i) ? 'tabindex="-1" aria-hidden="true"' : ''}>${esc(b.t)}</button>`).join('')}</div>`;

    case 'match': {
      const fl = q.flash || {};
      const cell = (side, id) => {

function flashAnswer(know) {
  const it = F.queue[F.idx]; if (!it) return;
  if (know) { F.known++; if (!F.again.has(it.id)) record(it, true); chime(true); }
  else { F.again.set(it.id, it); F.queue.push(it); it.w++; it.last = Date.now(); buzz(60); }
  save();

  if (F.idx >= F.queue.length) {
    const d = deckById(F.deckId);
    bumpStreak(); const xp = F.total * 2; DB.xp += xp; save();

}

function bindSwipe(card) {
  if (!card) return;
  let x0 = null, y0 = 0, dx = 0, moved = false;
  card.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; dx = 0; moved = false; });
  card.addEventListener('pointermove', e => {
    if (x0 == null) return;
    dx = e.clientX - x0;
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(e.clientY - y0)) {
      moved = true;
      card.style.transition = 'none';
      card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)${F.flipped ? ' rotateY(180deg)' : ''}`;
      const k = card.querySelector('.swipe-tag.k'), a = card.querySelector('.swipe-tag.a');
      if (k) k.style.opacity = Math.max(0, Math.min(1, dx / 90));
      if (a) a.style.opacity = Math.max(0, Math.min(1, -dx / 90));
    }
  });
  const end = () => {
    if (x0 == null) return; x0 = null;
    if (moved && Math.abs(dx) > 90) { card.dataset.swiped = '1'; flashAnswer(dx > 0); return; }
    card.style.transition = ''; card.style.transform = '';
    card.querySelectorAll('.swipe-tag').forEach(t => t.style.opacity = 0);
    if (moved) card.dataset.swiped = '1';
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}

  'set-count': el => { DB.settings.count = +el.dataset.v; save(); render(); },
  'toggle': el => { const k = el.dataset.k; DB.settings[k] = !DB.settings[k]; save(); render(); },
  'ask-delete': () => { UI.modal = { type: 'delete' }; render(); },
  'delete': () => { DB.decks = DB.decks.filter(d => d.id !== UI.deckId); save(); UI.modal = null; UI.screen = 'home'; render(true); toast('단어장을 삭제했어요'); },
  'start': el => el.dataset.mode === 'flash' ? startFlash() : startLesson(el.dataset.mode),
  'say': (el, e) => { e.stopPropagation(); speak(el.dataset.t, !!el.dataset.slow); },
  'opt': el => { const q = curQ(); if (L.answered) return; q.sel = +el.dataset.i; const ot = q.opts[q.sel]; if (q.kind === 'mc-ko' && DB.settings.autoplay) speak(ot); renderLesson(); },
  'build': el => {
    const q = curQ(); if (L.answered) return; const i = +el.dataset.i;
    if (q.built.includes(i) || (q.kind === 'spell' && q.built.length >= q.answer.length)) return;
    q.built.push(i);
    if (q.kind !== 'spell' && q.kind !== 'build-ko' && DB.settings.autoplay && TTS) speak(q.bank[i].t);
    renderLesson();
  },
  'unbuild': el => { const q = curQ(); if (L.answered) return; q.built.splice(+el.dataset.pos, 1); renderLesson(); },
  'check': check,
  'giveup': giveUp,
  'next': nextQ,
  'mt': el => matchTap(el.dataset.side, el.dataset.id),
  'ask-quit': () => { UI.modal = { type: 'quit' }; render(); },
  'quit': () => { stopTimer(); L = null; F = null; UI.modal = null; UI.screen = 'deck'; render(true); },
  'flip': (el) => { if (el.dataset.swiped) { delete el.dataset.swiped; return; } F.flipped = !F.flipped; el.classList.toggle('flipped', F.flipped); },
  'fc-know': () => flashAnswer(true),
  'fc-again': () => flashAnswer(false),
  'retry-missed': () => { const d = deckById(R.deckId); if (!d) return; UI.deckId = d.id; const ids = new Set(R.missed.map(i => i.id)); startLesson('mixed', shuffle(d.items.filter(i => ids.has(i.id)))); },
  'back-deck': () => { UI.deckId = R.deckId; UI.screen = deckById(R.deckId) ? 'deck' : 'home'; render(true); },
  'paste-save': () => {
    const pairs = parseText(UI.pasteText || ''); if (!pairs.length) return;
    const name = (UI.pasteName || '').trim() || `붙여넣은 단어장 ${new Date().getMonth() + 1}/${new Date().getDate()}`;
    UI.pasteText = ''; UI.pasteName = '';
    addDecks([makeDeck(name, pairs)]);
  },
  'sheets-split': () => { const m = UI.modal; addDecks(m.sheets.map(s => makeDeck(s.name, s.pairs))); },
  'sheets-merge': () => { const m = UI.modal; addDecks([makeDeck(m.base, m.sheets.flatMap(s => s.pairs))]); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('keydown', e => {
  if (UI.modal) { if (e.key === 'Escape' && UI.modal.type !== 'quit') { UI.modal = null; render(); } return; }
  if (UI.screen === 'lesson' && L) {
    const q = curQ();
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); L.answered ? nextQ() : check(); return; }
    if (!L.answered && (q.kind === 'mc-en' || q.kind === 'mc-ko') && /^[1-4]$/.test(e.key) && +e.key <= q.opts.length) { q.sel = +e.key - 1; renderLesson(); }
  }
  if (UI.screen === 'flash' && F) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); F.flipped = !F.flipped; $('#card')?.classList.toggle('flipped', F.flipped); }
    else if (e.key === 'ArrowRight') flashAnswer(true);
    else if (e.key === 'ArrowLeft') flashAnswer(false);
  }
});
$('#file-in').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importChosen(f); });
window.addEventListener('popstate', () => {
  if ((UI.screen === 'lesson' && L) || (UI.screen === 'flash' && F)) {
    try { history.pushState({ s: UI.screen }, ''); } catch (e) {}
    UI.modal = { type: 'quit' }; render(); return;
  }
  if (UI.modal) { UI.modal = null; render(); return; }
  if (UI.screen === 'result') { UI.screen = 'deck'; render(true); return; }
  UI.screen = 'home'; render(true);
});
const app = $('#app');
['dragover', 'drop'].forEach(t => app.addEventListener(t, e => {
  if (!e.dataTransfer || ![...(e.dataTransfer.types || [])].includes('Files')) return;
  e.preventDefault();
  if (t === 'drop' && e.dataTransfer.files[0]) importChosen(e.dataTransfer.files[0]);
}));

render(true);
</script>
</body>
</html>
